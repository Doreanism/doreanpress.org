<?xml version="1.0" encoding="UTF-8"?>
<!-- The Dorean Press logo: the imprint mark and the name it stands over, as
     one object.

     The wide lockup — the mark beside a two-line name — with the name in
     LINUX LIBERTINE small capitals, letterspaced 8/1000 em. Chosen off a
     proof sheet (`sandbox/logo/`, untracked) that set the same four
     arrangements in every face this machine would carry.

     GENERATED, not drawn. The name is set by LuaLaTeX and deposited as glyph
     outlines, on the reasoning weaver/jacket.py gives for the wrap: a <text>
     element has no single layout, since every renderer resolves a font
     differently and Inkscape's own cached x wins over SVG 2's shape-inside
     everywhere but Inkscape, while a path has no layout to disagree about.
     Nothing has to be installed on a machine for this file to set correctly,
     and the face need not be one the book itself loads.

     Every measurement is stated in CAP HEIGHTS of the name — 100 user units —
     so the lockup scales as one object and these proportions are the design:

       mark height   2.60 cap heights
       gap beside it 0.60 cap heights
       lead          0.45 cap heights (1.45 baseline to baseline)

     That is the point of the file. The title page used to state the same
     lockup twice, once in inches for print and once in ems for the web, and
     the two had drifted: 3.52 cap heights of mark against 3.40, a gap of 0.74
     against 0.54. Nothing could catch it, two measurements of one design being
     indistinguishable from two designs.

     The color is `currentColor` throughout, as in figs/doreanlogo.svg and
     figs/reciprocity-colabor.svg, and for the same reason: inlined into a page
     by html.py it simply *is* the ink token, in either theme and under the
     manual toggle; standing alone — print, the EPUB, any renderer that loads
     it in an <img> of its own — it is black, which is what those want.

     Coordinates are rounded to a hundredth of a point of the 100 pt setting,
     which is 1/6474 of a cap height. -->
