name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        # Matches the npm major that generates package-lock.json locally. npm 11
        # writes lockfiles that omit nested entries for conflicting peer ranges
        # (vite-node wants cac@^6 while the hoisted cac is 7), and npm 10 rightly
        # refuses to install from one — so the toolchain has to agree with the
        # lockfile it is handed. Several dependencies also ask for ^24.11 anyway.
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` and not `npm install`: it installs exactly what
      # package-lock.json pins, so CI checks the tree that actually ships.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
